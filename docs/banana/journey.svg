<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Where Banana Theft Auto is: boot, first picture, controller, menus, loading screens and the first world picture done; cleaning up the world picture now; 30 fps ahead">
  <defs>
    <linearGradient id="j-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0638"/><stop offset="1" stop-color="#3a0f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" rx="18" fill="url(#j-bg)"/>
  <text x="300" y="40" text-anchor="middle" font-family="Arial Black, Impact, Segoe UI, sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="#ffe14d">WHERE WE ARE</text>
  <text x="300" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d9c6f0">updated 2026-11-27</text>
  <!-- road -->
  <path d="M45,170 H555" stroke="#5a2a86" stroke-width="14" stroke-linecap="round"/>
  <path d="M45,170 H475" stroke="#ffd600" stroke-width="14" stroke-linecap="round"/>
  <path d="M55,170 H545" stroke="#1b0638" stroke-width="2" stroke-dasharray="10 10" opacity=".6"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">
    <!-- done -->
    <g fill="#ffd600" stroke="#3b2200" stroke-width="3">
      <circle cx="55" cy="170" r="13"/><circle cx="125" cy="170" r="13"/><circle cx="195" cy="170" r="13"/><circle cx="265" cy="170" r="13"/><circle cx="335" cy="170" r="13"/><circle cx="405" cy="170" r="13"/>
    </g>
    <g fill="none" stroke="#3b2200" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48,170 l5,5 l9,-10"/><path d="M118,170 l5,5 l9,-10"/><path d="M188,170 l5,5 l9,-10"/><path d="M258,170 l5,5 l9,-10"/><path d="M328,170 l5,5 l9,-10"/><path d="M398,170 l5,5 l9,-10"/>
    </g>
    <g fill="#fff6d6">
      <text x="55" y="204">Boots</text>
      <text x="125" y="204">First</text><text x="125" y="219">picture</text>
      <text x="195" y="204">Controller</text>
      <text x="265" y="204">Menus &amp;</text><text x="265" y="219">saves</text>
      <text x="335" y="204">Loading</text><text x="335" y="219">screens</text>
      <text x="405" y="204">World</text><text x="405" y="219">picture</text>
    </g>
    <!-- here -->
    <circle cx="475" cy="170" r="20" fill="#ff4fa3" stroke="#fff" stroke-width="3"/>
    <text x="475" y="176" fill="#fff" font-weight="700" font-size="15">!</text>
    <text x="475" y="210" fill="#ff9ccf" font-weight="700">Clean</text>
    <text x="475" y="226" fill="#ff9ccf" font-weight="700">picture</text>
    <!-- banana "you are here" pin -->
    <g transform="translate(447,86) rotate(-12)">
      <path d="M8,40 C10,16 34,2 58,10 C60,11 60,14 58,15 C40,18 28,32 22,50 C20,55 9,54 8,40 Z" fill="#ffe14d" stroke="#a87800" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M58,10 L62,7" stroke="#6b4a00" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="475" y="80" fill="#ffe14d" font-weight="700" font-size="13">YOU ARE HERE</text>
    <!-- ahead -->
    <g fill="#3a0f5e" stroke="#8d6bb8" stroke-width="3"><circle cx="545" cy="170" r="13"/></g>
    <g fill="#bba6d9"><text x="545" y="204">30 fps</text></g>
  </g>
  <text x="300" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d9c6f0">Now: a clean, steady world picture (no white or black flashes)</text>
</svg>
